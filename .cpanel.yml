---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/ervoy.mx/
    # strona v2 - statyczny HTML z generatora (v2/src/build.py), zbudowany lokalnie i wypchniety w v2/site
    - /bin/cp -r v2/site/. $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    # arkusz, skrypt i mapa maja odcisk tresci w nazwie - kasujemy wersje, ktorych nie ma w biezacym wydaniu
    - /bin/sh -c 'for f in $DEPLOYPATH/assets/style.*.css $DEPLOYPATH/assets/site.*.js $DEPLOYPATH/assets/map.*.svg; do [ -e "$f" ] || continue; [ -e "v2/site/assets/$(basename "$f")" ] || rm -f "$f"; done'
    # grupoervoy.com przekierowuje 301 na ervoy.mx
    - /bin/cp redirect-grupoervoy.htaccess $HOME/public_html/grupoervoy.com/.htaccess
